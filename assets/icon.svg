<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    FenxiDL app mark: three parallel connection lanes resolving into a single
    download arrow.

    Grid 1024, squircle radius 232, shapes centred on x = 512.
      lanes   width 146, gap 54, span 546
              (x 239..785), y 186..478
      band    y 452..548, half-width 236
      head    apex (512, 876)
      optical span y 186..876 = 690 (centre 531.0)
  -->
  <defs>
    <linearGradient id="bg" x1="0.06" y1="0" x2="0.94" y2="1">
      <stop offset="0" stop-color="#2c4059"/>
      <stop offset="0.46" stop-color="#121b26"/>
      <stop offset="1" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="lane" x1="0.1" y1="0" x2="0.9" y2="0.7">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.44" stop-color="#96e3ff"/>
      <stop offset="1" stop-color="#2f96e6"/>
    </linearGradient>
    <linearGradient id="head" x1="0.16" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="0.3" stop-color="#8ce5ff"/>
      <stop offset="0.74" stop-color="#2ba5f7"/>
      <stop offset="1" stop-color="#0a55c4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <path fill="url(#head)" d="M276 452 H748 V548 L512 876 L276 548 Z"/>
  <g fill="url(#lane)">
    <rect x="239.0" y="186" width="146" height="292" rx="73.0"/>
    <rect x="439.0" y="186" width="146" height="292" rx="73.0"/>
    <rect x="639.0" y="186" width="146" height="292" rx="73.0"/>
  </g>
</svg>
